plugins {
	id 'java'
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

def generatedResources = layout.buildDirectory.dir('generated/resources')

// Собственный jar лоадера не опубликован на публичном maven, поэтому якорь
// кладёт его на диск сам; сторонние библиотеки (Mixin, ASM) остаются на
// maven.fabricmc.net и их штатно скачивает лаунчер.
tasks.register('copyLoaderJar', Copy) {
	dependsOn rootProject.tasks.named('finalJar')
	from rootProject.tasks.named('finalJar').get().archiveFile
	into generatedResources
	rename { 'argentumloader.jar' }
}

tasks.register('generateAnchorLibraries') {
	def installerConfig = rootProject.configurations.getByName('installer')
	dependsOn installerConfig

	def outFile = generatedResources.map { it.file('anchor-libraries.properties') }
	outputs.file(outFile)
	outputs.upToDateWhen { false }

	doLast {
		def sb = new StringBuilder()
		sb << "# сгенерировано автоматически задачей generateAnchorLibraries, не редактировать\n"

		def artifacts = installerConfig.resolvedConfiguration.resolvedArtifacts
		int i = 0

		for (artifact in artifacts) {
			sb << "lib.${i}.name=${artifact.moduleVersion}\n"
			sb << "lib.${i}.url=https://maven.fabricmc.net/\n"
			i++
		}

		sb << "count=${i}\n"
		sb << "mainClass=net.fabricmc.loader.impl.launch.knot.KnotClient\n"
		sb << "loader.group=${rootProject.group}\n"
		sb << "loader.artifact=argentum-loader\n"
		sb << "loader.version=${rootProject.version}\n"

		outFile.get().asFile.text = sb.toString()
	}
}

sourceSets.main.resources.srcDir generatedResources
processResources.dependsOn copyLoaderJar, generateAnchorLibraries

jar {
	archiveBaseName = 'argentum-anchor'
	manifest {
		attributes 'Main-Class': 'net.fabricmc.installer.anchor.AnchorMain'
	}
}

// Портативный .exe со встроенной Java — чтобы якорь работал даже у игроков без
// отдельно установленной Java. app-image (не msi/exe-инсталлятор), поэтому не
// требует WiX на машине сборки: просто папка с .exe и рантаймом внутри, которую
// можно скопировать/заzip'ить и раздать как есть.
tasks.register('jpackageAnchor', Exec) {
	dependsOn jar
	group = 'distribution'
	description = 'Собирает портативный ArgentumAnchor.exe со встроенной Java (jpackage)'

	def jdk21 = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}.get()
	def jpackageBin = jdk21.metadata.installationPath.file('bin/jpackage.exe')

	def inputDir = layout.buildDirectory.dir('jpackage-input').get().asFile
	def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
	def jarFile = tasks.named('jar').get().archiveFile.get().asFile
	def iconFile = project.file('src/main/resources/icon/argentum.ico')

	// jpackage требует чисто числовую версию (major[.minor[.patch]]), а на Windows major не
	// может быть 0 — отбрасываем "+local" и поднимаем major до 1, если он нулевой.
	def versionParts = project.version.toString().split('\\+')[0].split('\\.')
	if (versionParts.length > 0 && versionParts[0] == '0') {
		versionParts[0] = '1'
	}
	def appVersion = versionParts.join('.')

	inputs.file(jarFile)
	inputs.file(iconFile)
	outputs.dir(outputDir)

	doFirst {
		delete inputDir
		inputDir.mkdirs()
		copy {
			from jarFile
			into inputDir
		}
		delete outputDir
	}

	commandLine(
			jpackageBin.asFile.absolutePath,
			'--type', 'app-image',
			'--input', inputDir.absolutePath,
			'--main-jar', jarFile.name,
			'--main-class', 'net.fabricmc.installer.anchor.AnchorMain',
			'--name', 'ArgentumAnchor',
			'--app-version', appVersion,
			'--icon', iconFile.absolutePath,
			'--dest', outputDir.absolutePath
	)
}
